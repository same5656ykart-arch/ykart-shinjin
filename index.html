<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<title>現地調査ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 1画面アプリ: 上に固定ヘッダー、下に固定タブ、中央がスクロール。紺の作業着 × 墨 × 朱のアクセント */
:root{
  --bg:#f3f3f0; --surface:#ffffff; --surface2:#e9eae6; --line:#d2d4ce;
  --fg:#1d2026; --muted:#5e636c;
  --accent:#1f3a5f; --accent-fg:#ffffff;
  --ok:#2e7d4f; --bad:#c8452b; --bad-bg:#fbe9e5; --ok-bg:#e4f2ea;
  --tip:#eef3fa; --tip-line:#b9cbe4;
  --font-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-display:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171b; --surface:#1f2228; --surface2:#2a2e36; --line:#3a3f49;
  --fg:#eceef1; --muted:#a3a8b3;
  --accent:#8fb4e3; --accent-fg:#0f1a2a;
  --ok:#6cc08f; --bad:#f08a74; --bad-bg:#3a2520; --ok-bg:#1e3328;
  --tip:#222a36; --tip-line:#3a4b63; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15171b; --surface:#1f2228; --surface2:#2a2e36; --line:#3a3f49;
  --fg:#eceef1; --muted:#a3a8b3;
  --accent:#8fb4e3; --accent-fg:#0f1a2a;
  --ok:#6cc08f; --bad:#f08a74; --bad-bg:#3a2520; --ok-bg:#1e3328;
  --tip:#222a36; --tip-line:#3a4b63; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:72px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100%}
header.bar{background:var(--accent);color:var(--accent-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;min-height:52px}
header.bar h1{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.bar .sub{font-size:12px;opacity:.85;font-weight:400}
header.bar button{background:transparent;border:1px solid rgba(255,255,255,.45);color:inherit;border-radius:6px;padding:6px 10px;font-size:13px;white-space:nowrap}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main > .view{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:9px 2px 8px;font-size:13px;color:var(--muted);border-top:3px solid transparent;font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .cnt{font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;margin-left:auto}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row > *{flex:1 1 140px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.tip{background:var(--tip);border:1px solid var(--tip-line);border-radius:8px;padding:9px 12px;font-size:13.5px}
.tip b{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;font-weight:400}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:12px;color:var(--muted)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

/* 工事種別の選択 */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:18px 10px;font-family:var(--font-display);font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.types button small{font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted)}
.types button[aria-pressed="true"]{border-color:var(--accent);background:var(--tip);color:var(--accent)}
.types button[aria-pressed="true"]::before{content:"✓ "}

/* 調査シート */
.sheet-head{display:flex;align-items:center;gap:10px;padding:4px 2px}
.sheet-head h2{font-size:20px;flex:1}
.jump{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px;font-size:13px;font-weight:700}
.sec{border-left:4px solid var(--accent)}
.sec h2 .no{font-size:12px;color:var(--accent);font-family:var(--font-body)}
.chk{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0;padding-bottom:0}
.chk .top{display:flex;align-items:flex-start;gap:10px}
.chk .top input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.chk .top label{flex:1;min-width:0}
.chk .top label small{display:block;color:var(--muted);font-size:12.5px}
.chk.done .top label{color:var(--muted)}
.chk .memo{margin-left:32px;width:calc(100% - 32px);padding:6px 9px;font-size:14px}
.dim{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.dim:last-child{border-bottom:0}
.dim label{font-size:14px}
.dim label small{display:block;color:var(--muted);font-size:12px}
.dim .in{display:flex;align-items:center;gap:4px}
.dim .in input{padding:8px;text-align:right}
.dim .in span{font-size:12px;color:var(--muted)}
.dim.done label{color:var(--muted)}
.shot{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.shot:last-child{border-bottom:0}
.shot .th{width:64px;height:48px;border-radius:6px;background:var(--surface2);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;border:1px solid var(--line);overflow:hidden}
.shot .th img{width:100%;height:100%;object-fit:cover;display:block}
.shot .lb{min-width:0}
.shot .lb small{display:block;color:var(--muted);font-size:12px}
.shot.done .lb{color:var(--muted)}
.shot .ops{display:flex;gap:4px}
.shot input[type=file]{display:none}
.ask{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ask:last-child{border-bottom:0}
.ask label{font-size:14px;font-weight:700}
.ask label small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.ask input{padding:8px 9px}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.extra .ph{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface2)}
.extra .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.extra .ph input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:12px;padding:5px 6px}
.extra .ph button{position:absolute;top:4px;right:4px;background:var(--bad);color:#fff;border:0;border-radius:999px;width:24px;height:24px;font-size:13px;line-height:1}

pre.report{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:8px;padding:12px;font-family:var(--font-body);font-size:13px;line-height:1.5;margin:0;max-height:50vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.confirm{border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.home-hero h2{font-size:22px}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kit label{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.kit input{width:auto;margin:0}
.miss li{margin:3px 0}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

</div>

    ]},
};
const TYPE_ORDER=['toilet','bath','wash','kitchen'];
/* どの工事でも必ず見るもの */
const COMMON = { name:'どの工事でも', 
  see:[ ['給湯器の種類と設置年','本体のシール。10年超なら交換提案の候補'], ['分電盤の空き回路','フタを開けて見る'], ['玄関から現場までの搬入経路','幅・曲がり角・階段'], ['工事車両を停める場所',''] ],
  measure:[],
  shots:[ ['給湯器のシール',''], ['分電盤','フタを開けて'], ['玄関〜現場の経路',''], ['駐車場所','']],
  ask:[ ['工事中、車はどこに停めてよい？',''], ['電気・水道・トイレを借りてよい？',''], ['ご近所で挨拶が必要なお宅は？',''] ],
};
function blocks(s){ return [...(s.types||[]).map(t=>({key:t, ...TYPES[t]})), {key:'common', ...COMMON}]; }
const KIT = ['メジャー(5.5m)','レーザー距離計','スマホ(充電OK)','懐中電灯','脚立','マスキングテープ','筆記用具','名刺','カタログ','スリッパ','養生シート','マスク・手袋'];

/* ========= 保存（IndexedDB。使えない時はメモリ） ========= */
const DB = {
  mem:{}, ok:true,
  open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('genchi-navi',1); r.onupgradeneeded=()=>r.result.createObjectStore('surveys',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){rej(e)} }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('surveys',mode); const q=fn(t.objectStore('surveys')); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async all(){ try{ const r=await this.tx('readonly',s=>s.getAll()); this.ok=true; return r; }catch(e){ this.ok=false; return Object.values(this.mem); } },
  async put(s){ this.mem[s.id]=s; try{ await this.tx('readwrite',st=>st.put(s)); this.ok=true; }catch(e){ this.ok=false; throw e; } },
  async del(id){ delete this.mem[id]; try{ await this.tx('readwrite',st=>st.delete(id)); }catch(e){} },
};

/* ========= 状態 ========= */
const state = { surveys:[], cur:null, tab:'sheet', confirmDel:null, kit:{}, pick:null };
const $ = sel=>document.querySelector(sel);
const view=$('#view'), tabs=$('#tabs'), titleEl=$('#title'), backBtn=$('#backBtn'), saveState=$('#saveState');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
function newSurvey(){ return { id:uid(), v:3, createdAt:Date.now(), updatedAt:Date.now(), types:[],
  customer:{date:today(), staff:'', name:'', address:'', tel:'', built:'', note:''},
  see:{}, dims:{}, shots:{}, answers:{}, extra:[], memo:'' }; }
const typeNames=s=>(s.types||[]).map(t=>TYPES[t]?.name).filter(Boolean);
const key=(b,kind,i)=>b+'.'+kind+'.'+i;

let saveTimer=null;
function save(immediate){
  if(!state.cur) return; state.cur.updatedAt=Date.now(); saveState.textContent='保存中…'; clearTimeout(saveTimer);
  const run=async()=>{ try{ await DB.put(state.cur); saveState.textContent='保存済'; }catch(e){ saveState.textContent='⚠ 保存できません'; } };
  if(immediate) return run(); saveTimer=setTimeout(run,400);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state.cur){ clearTimeout(saveTimer); DB.put(state.cur).catch(()=>{}); } });

/* ========= 進捗・不足 ========= */
function counts(s,b){ const c={see:[0,b.see.length],measure:[0,b.measure.length],shots:[0,b.shots.length],ask:[0,b.ask.length]};
  b.see.forEach((_,i)=>{ if(s.see[key(b.key,'see',i)]?.done) c.see[0]++; });
  b.measure.forEach((_,i)=>{ if(String(s.dims[key(b.key,'measure',i)]??'').trim()) c.measure[0]++; });
  b.shots.forEach((_,i)=>{ if(s.shots[key(b.key,'shots',i)]) c.shots[0]++; });
  b.ask.forEach((_,i)=>{ if(String(s.answers[key(b.key,'ask',i)]??'').trim()) c.ask[0]++; });
  return c; }
function progress(s){ let d=0,t=0; blocks(s).forEach(b=>{ const c=counts(s,b); Object.values(c).forEach(([a,n])=>{d+=a;t+=n;}); }); ['name','address','tel'].forEach(k=>{ t++; if(String(s.customer[k]).trim()) d++; }); return t?Math.round(d/t*100):0; }
function missing(s){ const m=[]; if(!(s.types||[]).length) m.push('工事の種類が未選択');
  blocks(s).forEach(b=>{ const c=counts(s,b); const lab={see:'見る',measure:'測る',shots:'写真',ask:'聞く'};
    Object.entries(c).forEach(([k,[a,n]])=>{ if(n&&a<n) m.push(`${b.name}：${lab[k]} ${n-a}件 残り`); }); });
  [['name','お客様名'],['address','住所'],['tel','電話番号']].forEach(([k,l])=>{ if(!String(s.customer[k]).trim()) m.push(l); });
  return m; }

/* ========= 画面 ========= */
const TABS=[['sheet','調査シート'],['customer','お客様情報'],['summary','まとめ']];
function setTitle(){ const s=state.cur; const t=typeNames(s).join('・'); const c=s.customer.name; titleEl.innerHTML=esc(t||'新規調査')+' <span class="sub">'+esc(c?c+' 様':s.customer.date)+'</span>'; }
function render(){
  if(!state.cur){ renderHome(); return; }
  backBtn.hidden=false; setTitle();

  tabs.hidden=needPick;
  if(needPick){ renderPick(); $('main').scrollTop=0; return; }
  tabs.innerHTML=TABS.map(([id,l])=>`<button data-tab="${id}" ${state.tab===id?'aria-current="page"':''}>${l}</button>`).join('');
  ({sheet:renderSheet, customer:renderCustomer, summary:renderSummary})[state.tab]();
  $('main').scrollTop=0;
}

  <button class="btn primary block" id="newBtn">＋ 新しい調査を始める</button>
  ${list.length?`<div class="list">${list.map(s=>{const p=progress(s); return `<button class="item" data-open="${s.id}"><div class="t"><b>${esc(typeNames(s).join('・')||'種類未選択')}　${esc(s.customer.name?s.customer.name+' 様':'')}</b><span>${esc(s.customer.date)}　${esc(s.customer.address||'')}</span></div><span class="pill ${p>=100?'ok':''}">${p}%</span></button>`}).join('')}</div>`:`<div class="empty">まだ調査データがありません。<br>上のボタンから始めてください。</div>`}
  <details class="card"><summary style="cursor:pointer;font-weight:700;font-family:var(--font-display)">出発前の持ち物チェック</summary>
    <div class="kit" style="margin-top:10px">${KIT.map((k,i)=>`<label><input type="checkbox" data-kit="${i}" ${state.kit[i]?'checked':''}>${esc(k)}</label>`).join('')}</div></details>

  $('#importFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); const arr=Array.isArray(d)?d:[d]; let n=0; for(const s of arr){ if(!s||!s.id||s.v!==3) continue; const i=state.surveys.findIndex(x=>x.id===s.id); if(i>=0) state.surveys[i]=s; else state.surveys.push(s); await DB.put(s); n++; } toast(n+'件を読み込みました'); render(); }catch(err){ toast('読み込めませんでした'); } };

/* 最初の画面：工事の種類 */

/* 調査シート：種類ごとに 見る → 測る → 写真 → 聞く */
function renderSheet(){
  const s=state.cur;
  const sec=(b,kind,no,title,inner,cnt)=>`<div class="card sec" id="${b.key}-${kind}"><h2><span class="no">${no}</span>${title} <span class="cnt ${cnt[0]===cnt[1]?'ok':''}">${cnt[0]}/${cnt[1]}</span></h2>${inner}</div>`;
  const html=blocks(s).map(b=>{ const c=counts(s,b);
    const see=b.see.map(([lab,hint],i)=>{ const k=key(b.key,'see',i); const v=s.see[k]||{}; return `<div class="chk ${v.done?'done':''}"><div class="top"><input type="checkbox" id="c_${k}" data-see="${k}" ${v.done?'checked':''}><label for="c_${k}">${esc(lab)}${hint?`<small>${esc(hint)}</small>`:''}</label></div><input class="memo" data-seememo="${k}" value="${esc(v.memo||'')}" placeholder="気になる点があれば（例：床がふかつく）"></div>`; }).join('');
    const measure=b.measure.map(([lab,unit,hint],i)=>{ const k=key(b.key,'measure',i); const v=s.dims[k]??''; return `<div class="dim ${String(v).trim()?'done':''}"><label for="d_${k}">${esc(lab)}${hint?`<small>${esc(hint)}</small>`:''}</label><div class="in"><input id="d_${k}" data-dim="${k}" value="${esc(v)}" ${unit?'type="number" inputmode="numeric"':'placeholder="幅×高さ"'}>${unit?`<span>${unit}</span>`:''}</div></div>`; }).join('');
    const shots=b.shots.map(([lab,hint],i)=>{ const k=key(b.key,'shots',i); const p=s.shots[k]; return `<div class="shot ${p?'done':''}"><div class="th">${p?`<img src="${p.data}" alt="">`:'未'}</div><div class="lb">${esc(lab)}${hint?`<small>${esc(hint)}</small>`:''}</div><div class="ops"><label class="btn sm ${p?'':'primary'}">${p?'撮り直す':'📷 撮る'}<input type="file" accept="image/*" capture="environment" data-shot="${k}"></label>${p?`<button class="btn sm danger" data-delshot="${k}">×</button>`:''}</div></div>`; }).join('');
    const ask=b.ask.map(([q,hint],i)=>{ const k=key(b.key,'ask',i); return `<div class="ask"><label for="a_${k}">${esc(q)}${hint?`<small>${esc(hint)}</small>`:''}</label><input id="a_${k}" data-ask="${k}" value="${esc(s.answers[k]||'')}" placeholder="お客様の言葉をそのままメモ"></div>`; }).join('');
    return `<div class="sheet-head"><h2>${esc(b.name)}</h2>${b.days?`<span class="pill">${esc(b.days)}</span>`:''}</div>
      ${b.key!=='common'?`<div class="jump"><button data-jump="${b.key}-see">見る ${c.see[0]}/${c.see[1]}</button><button data-jump="${b.key}-measure">測る ${c.measure[0]}/${c.measure[1]}</button><button data-jump="${b.key}-shots">写真 ${c.shots[0]}/${c.shots[1]}</button><button data-jump="${b.key}-ask">聞く ${c.ask[0]}/${c.ask[1]}</button></div>`:''}
      ${sec(b,'see','1','見る',see,c.see)}
      ${b.measure.length?sec(b,'measure','2','測る',`<div class="tip" style="margin-bottom:8px">単位は mm。壁の内側から内側を測る。分からない所は空欄のまま写真を撮って先輩に聞く。</div>`+measure,c.measure):''}
      ${sec(b,'shots','3','写真を撮る',shots,c.shots)}
      ${sec(b,'ask','4','聞く',ask,c.ask)}`; }).join('');
  view.innerHTML=`${html}
  <div class="card"><h2>その他の写真 <span class="cnt">${s.extra.length}枚</span></h2>
    <div class="actions"><label class="btn">📷 気になった所を撮る<input type="file" accept="image/*" capture="environment" id="extraCam" multiple hidden></label><label class="btn sm">🖼 写真を選ぶ<input type="file" accept="image/*" id="extraLib" multiple hidden></label></div>
    ${s.extra.length?`<div class="extra">${s.extra.map(p=>`<div class="ph" data-ex="${p.id}"><img src="${p.data}" alt=""><input data-excap value="${esc(p.caption||'')}" placeholder="ひとこと"><button data-delex="${p.id}" aria-label="削除">×</button></div>`).join('')}</div>`:''}
  </div>
  <div class="card"><h2>メモ</h2><textarea id="memo" placeholder="気づいたこと・先輩に相談したいこと">${esc(s.memo||'')}</textarea></div>
  <div class="actions"><button class="btn sm" id="changeTypes">工事の種類を変更</button><button class="btn primary" style="flex:1" data-go="customer">次へ：お客様情報 →</button></div>`;
  view.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>$('#'+b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'}));
  view.querySelectorAll('[data-see]').forEach(c=>c.onchange=()=>{ const k=c.dataset.see; s.see[k]={...(s.see[k]||{}),done:c.checked}; c.closest('.chk').classList.toggle('done',c.checked); refreshCounts(); save(); });
  view.querySelectorAll('[data-seememo]').forEach(i=>i.oninput=()=>{ const k=i.dataset.seememo; s.see[k]={...(s.see[k]||{}),memo:i.value}; save(); });
  view.querySelectorAll('[data-dim]').forEach(i=>i.oninput=()=>{ s.dims[i.dataset.dim]=i.value; i.closest('.dim').classList.toggle('done',!!i.value.trim()); refreshCounts(); save(); });
  view.querySelectorAll('[data-ask]').forEach(i=>i.oninput=()=>{ s.answers[i.dataset.ask]=i.value; refreshCounts(); save(); });
  view.querySelectorAll('[data-shot]').forEach(i=>i.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ s.shots[i.dataset.shot]={data:await shrink(f),at:Date.now()}; await save(true); toast('保存しました'); }catch(err){ toast('保存できませんでした（容量不足の可能性）'); } renderSheet(); setTimeout(()=>$('#'+i.dataset.shot.split('.').slice(0,2).join('-'))?.scrollIntoView({block:'start'}),0); });
  view.querySelectorAll('[data-delshot]').forEach(b=>b.onclick=()=>{ delete s.shots[b.dataset.delshot]; save(); renderSheet(); setTimeout(()=>$('#'+b.dataset.delshot.split('.').slice(0,2).join('-'))?.scrollIntoView({block:'start'}),0); });
  const addExtra=async files=>{ let n=0; for(const f of files){ try{ s.extra.push({id:uid(),data:await shrink(f),caption:''}); n++; }catch(e){} } if(n){ try{ await save(true); toast(n+'枚を追加'); }catch(e){ toast('保存できませんでした'); } } renderSheet(); setTimeout(()=>$('#extraCam')?.closest('.card').scrollIntoView({block:'start'}),0); };
  $('#extraCam').onchange=e=>addExtra(e.target.files); $('#extraLib').onchange=e=>addExtra(e.target.files);
  view.querySelectorAll('[data-excap]').forEach(i=>i.oninput=()=>{ const p=s.extra.find(x=>x.id===i.closest('[data-ex]').dataset.ex); p.caption=i.value; save(); });
  view.querySelectorAll('[data-delex]').forEach(b=>b.onclick=()=>{ s.extra=s.extra.filter(p=>p.id!==b.dataset.delex); save(); renderSheet(); });
  $('#memo').oninput=e=>{ s.memo=e.target.value; save(); };
  $('#changeTypes').onclick=()=>{ state.pick=[...s.types]; render(); };
  bindNav();
}
function refreshCounts(){ const s=state.cur; blocks(s).forEach(b=>{ const c=counts(s,b); Object.entries(c).forEach(([k,[a,n]])=>{ const el=$('#'+b.key+'-'+k+' .cnt'); if(el){ el.textContent=a+'/'+n; el.classList.toggle('ok',a===n); } const j=view.querySelector(`[data-jump="${b.key}-${k}"]`); if(j) j.textContent={see:'見る',measure:'測る',shots:'写真',ask:'聞く'}[k]+' '+a+'/'+n; }); }); }

function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const max=1280; const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); }; img.src=url; }); }

    ${f('note','その他',{ta:1,ph:'ご家族構成、留守・鍵のこと、他社見積の有無、補助金の希望など'})}
  </div>
  <div class="actions"><button class="btn" data-go="sheet">← 調査シート</button><button class="btn primary" style="flex:1" data-go="summary">次へ：まとめ →</button></div>`;

function report(s){
  const L=[]; const c=s.customer;
  L.push(`【現地調査報告】${typeNames(s).join('・')||'（種類未選択）'}　${c.name||'（お名前未入力）'} 様`);
  L.push(`調査日：${c.date}　担当：${c.staff||'－'}`, `住所：${c.address||'－'}　TEL：${c.tel||'－'}${c.built?`　築${c.built}年`:''}`);
  if(c.note) L.push(`その他：${c.note}`);
  blocks(s).forEach(b=>{
    L.push('',`■${b.name}`);
    const seen=b.see.map(([lab],i)=>{ const v=s.see[key(b.key,'see',i)]||{}; return {lab,v}; });
    const notes=seen.filter(x=>x.v.memo).map(x=>`・${x.lab}：${x.v.memo}`); const unseen=seen.filter(x=>!x.v.done).map(x=>x.lab);
    L.push(`[見た] ${seen.length-unseen.length}/${seen.length}`,...notes); if(unseen.length) L.push(`　未確認：${unseen.join('、')}`);
    if(b.measure.length){ L.push(`[採寸]`); b.measure.forEach(([lab,unit],i)=>{ const v=s.dims[key(b.key,'measure',i)]; L.push(`・${lab}：${String(v??'').trim()?v+(unit?' '+unit:''):'未'}`); }); }
    const taken=b.shots.filter((_,i)=>s.shots[key(b.key,'shots',i)]).length; const notTaken=b.shots.filter((_,i)=>!s.shots[key(b.key,'shots',i)]).map(x=>x[0]);
    L.push(`[写真] ${taken}/${b.shots.length}${notTaken.length?'　未撮影：'+notTaken.join('、'):''}`);
    L.push(`[聞いた]`); b.ask.forEach(([q],i)=>{ const a=s.answers[key(b.key,'ask',i)]; L.push(`・${q} → ${String(a??'').trim()?a:'未'}`); });
  });
  if(s.extra.length){ L.push('',`■その他の写真：${s.extra.length}枚`); s.extra.forEach((p,i)=>{ if(p.caption) L.push(`${i+1}. ${p.caption}`); }); }
  if(s.memo) L.push('',`■メモ・申し送り`,s.memo);
  const m=missing(s); if(m.length) L.push('',`■残り`,...m.map(x=>'・'+x));
  return L.join('\n');
}
function renderSummary(){
  const s=state.cur; const m=missing(s); const p=progress(s);
  view.innerHTML=`
  <div class="card"><h2>完了度 <span class="cnt">${p}%</span></h2><div class="prog"><i style="width:${p}%"></i></div>
    ${m.length?`<p class="muted" style="margin:10px 0 4px">帰る前に確認（お客様の前で埋めるのが一番早い）：</p><ul class="miss">${m.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p style="margin:10px 0 0;color:var(--ok);font-weight:700">全部そろっています。お疲れさまでした。</p>`}</div>
  <div class="tip"><b>帰る前のひとこと</b>「本日はありがとうございました。社内で確認して、〇日までにご連絡します」。分からなかった事は正直に「確認して連絡します」。</div>
  <div class="card"><h2>報告文</h2><pre class="report" id="reportText">${esc(report(s))}</pre>
    <div class="actions" style="margin-top:10px"><button class="btn primary" id="copyBtn">報告文をコピー</button><button class="btn" id="exportBtn">写真つきデータを書き出す（JSON）</button></div>
    <p class="muted" style="margin:8px 0 0">コピーした文章はLINEやメールにそのまま貼れます。</p></div>
  <div class="card">${state.confirmDel===s.id?`<div class="confirm"><span>この調査データを削除します。元に戻せません。</span><button class="btn sm danger" id="delYes">削除する</button><button class="btn sm" id="delNo">やめる</button></div>`:`<button class="btn danger sm" id="delBtn">この調査を削除</button>`}</div>
  <div class="actions"><button class="btn" data-go="customer">← お客様情報</button></div>`;
  $('#copyBtn').onclick=async()=>{ const t=report(s); try{ await navigator.clipboard.writeText(t); toast('コピーしました'); }catch(e){ const r=document.createRange(); r.selectNodeContents($('#reportText')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('文章を選択しました。長押しでコピーしてください'); } };
  $('#exportBtn').onclick=()=>{ const blob=new Blob([JSON.stringify(s,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`genchi_${s.customer.date}_${(s.customer.name||'noname').replace(/\s+/g,'')}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); toast('書き出しました'); };
  const db=$('#delBtn'); if(db) db.onclick=()=>{ state.confirmDel=s.id; renderSummary(); };
  const dy=$('#delYes'); if(dy) dy.onclick=async()=>{ await DB.del(s.id); state.surveys=state.surveys.filter(x=>x.id!==s.id); state.cur=null; state.confirmDel=null; toast('削除しました'); render(); };
  const dn=$('#delNo'); if(dn) dn.onclick=()=>{ state.confirmDel=null; renderSummary(); };
  bindNav();
}
function bindNav(){ view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.go; render(); }); }
tabs.onclick=e=>{ const b=e.target.closest('[data-tab]'); if(b){ state.tab=b.dataset.tab; render(); } };
backBtn.onclick=async()=>{ if(state.cur){ await save(true); } state.cur=null; state.confirmDel=null; state.pick=null; render(); };

/* ========= 起動 ========= */
(async()=>{
  try{ state.kit=JSON.parse(localStorage.getItem('kit')||'{}'); }catch(e){}
  state.surveys=(await DB.all()).filter(s=>s.v===3);   // 旧形式のデータは表示しない
  render();
  if(!DB.ok) toast('この環境では保存できません。入力内容は画面を閉じると消えます');
  if('serviceWorker' in navigator && location.protocol==='https:'){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
})();
</script>
