<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<title>現地調査ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 1画面アプリ: 上に固定ヘッダー、下に固定タブ、中央がスクロール。紺の作業着 × 墨 × 朱のアクセント */
:root{
  --bg:#f3f3f0; --surface:#ffffff; --surface2:#e9eae6; --line:#d2d4ce;
  --fg:#1d2026; --muted:#5e636c;
  --accent:#1f3a5f; --accent-fg:#ffffff;
  --ok:#2e7d4f; --bad:#c8452b; --bad-bg:#fbe9e5; --ok-bg:#e4f2ea;
  --tip:#eef3fa; --tip-line:#b9cbe4;
  --sun:#f2b544; --sun-fg:#1d2026; --hero:#0f1a2a;
  --font-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-display:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171b; --surface:#1f2228; --surface2:#2a2e36; --line:#3a3f49;
  --fg:#eceef1; --muted:#a3a8b3;
  --accent:#8fb4e3; --accent-fg:#0f1a2a;
  --ok:#6cc08f; --bad:#f08a74; --bad-bg:#3a2520; --ok-bg:#1e3328;
  --tip:#222a36; --tip-line:#3a4b63; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15171b; --surface:#1f2228; --surface2:#2a2e36; --line:#3a3f49;
  --fg:#eceef1; --muted:#a3a8b3;
  --accent:#8fb4e3; --accent-fg:#0f1a2a;
  --ok:#6cc08f; --bad:#f08a74; --bad-bg:#3a2520; --ok-bg:#1e3328;
  --tip:#222a36; --tip-line:#3a4b63; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:72px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100%}
header.bar{background:var(--accent);color:var(--accent-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;min-height:52px}
header.bar h1{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.bar .sub{font-size:12px;opacity:.85;font-weight:400}
header.bar button{background:transparent;border:1px solid rgba(255,255,255,.45);color:inherit;border-radius:6px;padding:6px 10px;font-size:13px;white-space:nowrap}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main > .view{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:9px 2px 8px;font-size:13px;color:var(--muted);border-top:3px solid transparent;font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .cnt{font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;margin-left:auto}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row > *{flex:1 1 140px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.tip{background:var(--tip);border:1px solid var(--tip-line);border-radius:8px;padding:9px 12px;font-size:13.5px}
.tip b{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;font-weight:400}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:12px;color:var(--muted)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

/* 工事種別の選択 */

/* 調査シート */
.sheet-head{display:flex;align-items:center;gap:10px;padding:4px 2px}
.sheet-head h2{font-size:20px;flex:1}
.jump{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px;font-size:13px;font-weight:700}
.sec{border-left:4px solid var(--accent)}
.sec h2 .no{font-size:12px;color:var(--accent);font-family:var(--font-body)}
.chk{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0;padding-bottom:0}
.chk .top{display:flex;align-items:flex-start;gap:10px}
.chk .top input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.chk .top label{flex:1;min-width:0}
.chk .top label small{display:block;color:var(--muted);font-size:12.5px}
.chk.done .top label{color:var(--muted)}
.chk .memo{margin-left:32px;width:calc(100% - 32px);padding:6px 9px;font-size:14px}
.dim{display:grid;grid-template-columns:1fr minmax(120px,45%);gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.dim:last-child{border-bottom:0}
.dim label{font-size:14px}
.dim label small{display:block;color:var(--muted);font-size:12px}
.dim .in{display:flex;align-items:center;gap:4px}
.dim .in input{padding:8px;text-align:right}
.dim .in span{font-size:12px;color:var(--muted)}
.dim.done label{color:var(--muted)}
.shot{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.shot:last-child{border-bottom:0}
.shot .th{width:64px;height:48px;border-radius:6px;background:var(--surface2);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;border:1px solid var(--line);overflow:hidden}
.shot .th img{width:100%;height:100%;object-fit:cover;display:block}
.shot .lb{min-width:0}
.shot .lb small{display:block;color:var(--muted);font-size:12px}
.shot.done .lb{color:var(--muted)}
.shot .ops{display:flex;gap:4px}
.shot input[type=file]{display:none}
.ask{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ask:last-child{border-bottom:0}
.ask label{font-size:14px;font-weight:700}
.ask label small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.ask input{padding:8px 9px}
.extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.extra .ph{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface2)}
.extra .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.extra .ph input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:12px;padding:5px 6px}
.extra .ph button{position:absolute;top:4px;right:4px;background:var(--bad);color:#fff;border:0;border-radius:999px;width:24px;height:24px;font-size:13px;line-height:1}

pre.report{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:8px;padding:12px;font-family:var(--font-body);font-size:13px;line-height:1.5;margin:0;max-height:50vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.confirm{border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.home-hero h2{font-size:22px}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kit label{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.kit input{width:auto;margin:0}
.miss li{margin:3px 0}

/* 雨漏れなど：大きな注意と、よくある原因の説明 */
.alert{border:3px solid var(--bad);background:var(--bad-bg);border-radius:12px;padding:14px}
.alert h2{color:var(--bad);font-size:22px;margin-bottom:8px}
.alert ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.alert li label{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;padding:8px 10px;background:var(--surface);border-radius:8px}
.alert li input{width:26px;height:26px;margin:0;accent-color:var(--bad);flex:0 0 auto}
.alert li .n{color:var(--bad);font-family:var(--font-display)}
.cases{display:flex;flex-direction:column;gap:8px}
.case{display:grid;grid-template-columns:minmax(72px,30%) 1fr;gap:4px 10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.case:last-child{border-bottom:0}
.case.pick{grid-template-columns:28px minmax(64px,28%) 1fr;cursor:pointer;border-radius:8px;padding:8px 6px}
.case.pick input{width:22px;height:22px;margin:2px 0 0;grid-row:span 2;accent-color:var(--accent)}
.case.pick.sel{background:var(--tip);border-bottom-color:transparent}
.case.pick.sel b{color:var(--accent)}
.case b{font-family:var(--font-display);color:var(--accent);grid-row:span 2}
.case .where{color:var(--muted)}
.calc-t{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
.calc-t th{font-size:11px;color:var(--muted);font-weight:400;text-align:right;padding:2px 4px}
.calc-t th:first-child{text-align:left}
.calc-t td{padding:4px;border-top:1px solid var(--tip-line)}
.calc-t td.num{text-align:right;white-space:nowrap}
.calc-t small{color:var(--muted);font-size:11px}
.points{background:var(--tip);border-color:var(--tip-line)}
.points ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.points li{font-size:13.5px}
.points li b{display:block;font-size:15px}
.points li span{color:var(--muted)}
.gloss{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13.5px}
.gloss div{padding:6px 0;border-bottom:1px dashed var(--line)}
.gloss b{display:block;color:var(--accent)}
.gloss span{color:var(--muted)}
.fig{color:var(--fg);background:var(--surface2);border-radius:8px;padding:8px;margin-bottom:10px}
.fig svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto}

/* ---- トップ画面 ---- */
header.bar.home{display:none}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:0 0 22px 22px;margin:-14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 22px max(20px,env(safe-area-inset-left,0px));
  background:
    linear-gradient(180deg,rgba(15,26,42,.15) 0%,rgba(15,26,42,.55) 55%,rgba(15,26,42,.92) 100%),
    url("hero.jpg") center/cover no-repeat,
    radial-gradient(120% 80% at 85% 0%,#e8a04a 0%,#b85c3a 28%,transparent 60%),
    radial-gradient(90% 70% at 10% 100%,#1f3a5f 0%,transparent 60%),
    var(--hero);
  min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.hero .sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero > *:not(.sky){position:relative}
.hero .brand{display:flex;align-items:center;gap:10px}
.hero .logo{height:34px;width:auto;max-width:200px;background:#fff;border-radius:6px;padding:4px 8px}
.hero .eyebrow{font-size:12px;letter-spacing:.14em;opacity:.85}
.hero h2{font-size:34px;line-height:1.1;letter-spacing:.02em}
.hero p{margin:0;font-size:13.5px;opacity:.9;max-width:34em}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.hero .meta span{font-size:12px;padding:4px 10px;border:1px solid rgba(255,255,255,.35);border-radius:999px;backdrop-filter:blur(4px)}
.hero .cta{margin-top:10px;background:var(--sun);color:var(--sun-fg);border:0;border-radius:12px;padding:15px 18px;font-size:16px;font-weight:700;font-family:var(--font-display);display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hero .cta::after{content:"→";font-size:20px}
.secttl{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.secttl h3{font-size:15px}
.secttl .cnt{font-size:12px;color:var(--muted)}
.slist{display:flex;flex-direction:column;gap:8px}
.scard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.scard .ring{width:44px;height:44px}
.scard .ring text{font-size:11px;font-weight:700;fill:var(--fg);font-variant-numeric:tabular-nums}
.scard .t{min-width:0}
.scard .t b{display:block;font-family:var(--font-display);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .t span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .go{color:var(--muted);font-size:18px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 12px;font-family:var(--font-display);font-weight:700;font-size:16px;display:grid;grid-template-columns:40px 1fr;gap:4px 10px;align-items:center;text-align:left;min-height:84px}
.types button .ic{grid-row:span 2;width:40px;height:40px;border-radius:10px;background:var(--tip);color:var(--accent);display:flex;align-items:center;justify-content:center}
.types button .ic svg{width:24px;height:24px}
.types button small{font-family:var(--font-body);font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.3}
.types button[aria-pressed="true"]{border-color:var(--accent);background:var(--tip);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.types button[aria-pressed="true"] .ic{background:var(--accent);color:var(--accent-fg)}
.types button[aria-pressed="true"]::before{content:none}
.homecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.homecard summary{cursor:pointer;font-weight:700;font-family:var(--font-display);list-style:none;display:flex;align-items:center;gap:8px}
.homecard summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.homecard[open] summary::before{transform:rotate(90deg)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <button id="backBtn" hidden aria-label="一覧へ戻る">← 一覧</button>
    <h1 id="title">現地調査ナビ <span class="sub">株式会社ワイケイアート</span></h1>
    <span id="saveState" class="sub"></span>
  </header>
  <main><div class="view" id="view"></div></main>
  <nav class="tabs" id="tabs" hidden></nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* =====================================================================
   工事の種類ごとの「見る・測る・写真・聞く」
   項目を増やすときは、この TYPES に1行足すだけで画面と報告文に反映されます
   ===================================================================== */
const TYPES = {
  toilet:{ name:'トイレ', days:'工事 半日〜2日',
    see:[ ['便器の品番シールを探す','タンクのフタの裏か、便器の横。メーカー名と型番が書いてある'], ['排水の管は「床」から出ているか「壁」から出ているか','便器の後ろ側をのぞくと分かる'], ['便座の近くにコンセントがあるか','温水洗浄便座（ウォシュレット）に必要。無いと電気工事が追加になる'], ['床を踏んでみて、ふわふわ沈まないか。便器のまわりが黒ずんでいないか','水漏れのサイン'] ],
    measure:[ ['トイレの部屋 幅','mm','壁の内側から内側まで'], ['トイレの部屋 奥行','mm',''], ['後ろの壁から、排水の管の真ん中まで（排水芯）','mm','床をのぞいて測る。200が標準。違えば先輩に相談'] ],
    shots:[ ['全体','ドアを開けて正面から'], ['品番シール','文字が読めるように近くで'], ['便器の後ろ側','排水の管と、水道の栓（止水栓）が写るように'] ],
    ask:[ ['一番困っていることは？','掃除・臭い・寒さ・古さ など'], ['タンクが無いタイプ（タンクレス）や、別の手洗い器は欲しい？',''], ['床や壁の紙（クロス）も一緒に替える？',''], ['予算の目安と、いつまでに？',''] ]},

/* ========= 保存（IndexedDB。使えない時はメモリ） ========= */
const DB = {
  mem:{}, ok:true,
  open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('genchi-navi',1); r.onupgradeneeded=()=>r.result.createObjectStore('surveys',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){rej(e)} }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('surveys',mode); const q=fn(t.objectStore('surveys')); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async all(){ try{ const r=await this.tx('readonly',s=>s.getAll()); this.ok=true; return r; }catch(e){ this.ok=false; return Object.values(this.mem); } },
  async put(s){ this.mem[s.id]=s; try{ await this.tx('readwrite',st=>st.put(s)); this.ok=true; }catch(e){ this.ok=false; throw e; } },
  async del(id){ delete this.mem[id]; try{ await this.tx('readwrite',st=>st.delete(id)); }catch(e){} },
};

function save(immediate){
  if(!state.cur) return; state.cur.updatedAt=Date.now(); saveState.textContent='保存中…'; clearTimeout(saveTimer);
  const run=async()=>{ try{ await DB.put(state.cur); saveState.textContent='保存済'; }catch(e){ saveState.textContent='⚠ 保存できません'; } };

/* ========= 進捗・不足 ========= */
function counts(s,b){ const intro=b.intro||[]; const c={see:[intro.filter((_,i)=>s.answers[key(b.key,'intro',i)]).length,b.see.length+intro.length],measure:[0,b.measure.length],shots:[0,b.shots.length],ask:[0,b.ask.length]};
  b.see.forEach((_,i)=>{ if(s.see[key(b.key,'see',i)]?.done) c.see[0]++; });
  b.measure.forEach((_,i)=>{ if(String(s.dims[key(b.key,'measure',i)]??'').trim()) c.measure[0]++; });
  b.shots.forEach((_,i)=>{ if(s.shots[key(b.key,'shots',i)]) c.shots[0]++; });
  b.ask.forEach((_,i)=>{ if(String(s.answers[key(b.key,'ask',i)]??'').trim()) c.ask[0]++; });
  return c; }
function progress(s){ let d=0,t=0; blocks(s).forEach(b=>{ const c=counts(s,b); Object.values(c).forEach(([a,n])=>{d+=a;t+=n;}); }); ['name','address','tel'].forEach(k=>{ t++; if(String(s.customer[k]).trim()) d++; }); return t?Math.round(d/t*100):0; }
function missing(s){ const m=[]; if(!(s.types||[]).length) m.push('工事の種類が未選択');
  blocks(s).forEach(b=>{ const c=counts(s,b); const lab={see:'見る',measure:'測る',shots:'写真',ask:'聞く'};
    Object.entries(c).forEach(([k,[a,n]])=>{ if(n&&a<n) m.push(`${b.name}：${lab[k]} ${n-a}件 残り`); }); });
  [['name','お客様名'],['address','住所'],['tel','電話番号']].forEach(([k,l])=>{ if(!String(s.customer[k]).trim()) m.push(l); });
  return m; }

/* 調査シート：種類ごとに 見る → 測る → 写真 → 聞く */
function dimVals(b,s){ return b.measure.map((_,i)=>s.dims[key(b.key,'measure',i)]); }
function calcRows(b,s){ if(!b.calc) return null; return b.calc(dimVals(b,s)); }
function calcSimpleRows(b,s){ if(!b.calcSimple) return null; return b.calcSimple(dimVals(b,s)); }
function calcHtml(b,s){ if(b.calcSimple){ const r=calcSimpleRows(b,s); return `<div class="tip" style="margin-top:8px">${b.calcNote?`<b>${esc(b.calcNote)}</b>`:''}${r?r.map(([n,v])=>`<div style="margin-top:4px">${esc(n)}：<b>${esc(v)}</b></div>`).join(''):'<span class="muted">見込みとちりを入れると自動計算します</span>'}</div>`; }
  const rows=calcRows(b,s); return `<div class="tip" style="margin-top:8px">${b.calcNote?`<b>${esc(b.calcNote)}</b>`:''}${rows?`<table class="calc-t"><tr><th></th><th>実平米</th><th>提示平米</th></tr>${rows.map(([n,a,k])=>`<tr><td>${esc(n)}</td><td class="num">${a.toFixed(1)} ㎡</td><td class="num"><b>${(a*k).toFixed(1)} ㎡</b><small>（×${k}）</small></td></tr>`).join('')}</table>`:'<span class="muted">幅・奥行・天井高を入れると自動計算します</span>'}</div>`; }
function renderSheet(){
  const s=state.cur;
  const sec=(b,kind,no,title,inner,cnt)=>`<div class="card sec" id="${b.key}-${kind}"><h2><span class="no">${no}</span>${title} <span class="cnt ${cnt[0]===cnt[1]?'ok':''}">${cnt[0]}/${cnt[1]}</span></h2>${inner}</div>`;

function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const max=1280; const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); }; img.src=url; }); }

/* ========= 小さなZIP（圧縮なし）。外部ライブラリ不要でオフラインでも動く ========= */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u){ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC_T[(c^u[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function dosTime(d){ return {t:(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), d:((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()}; }
async function makeZip(entries){ // entries: [{name, data: string|Blob|Uint8Array}]
  const enc=new TextEncoder(); const parts=[]; const cd=[]; let off=0; const {t,d}=dosTime(new Date());
  const u32=(v)=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255], u16=(v)=>[v&255,(v>>>8)&255];
  for(const e of entries){
    const name=enc.encode(e.name); const data=typeof e.data==='string'?enc.encode(e.data):(e.data instanceof Blob?new Uint8Array(await e.data.arrayBuffer()):e.data);
    const crc=crc32(data);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(t),...u16(d),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(t),...u16(d),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;
  }
  const cdSize=cd.reduce((a,x)=>a+x.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:'application/zip'});
}
async function readZip(blob){ // → {name: Uint8Array}（圧縮なしのみ。他のソフトで作り直したZIPは非対応）
  const buf=new Uint8Array(await blob.arrayBuffer()); const dv=new DataView(buf.buffer); const dec=new TextDecoder();
  let i=buf.length-22; while(i>=0 && dv.getUint32(i,true)!==0x06054b50) i--; if(i<0) throw new Error('zip');
  const n=dv.getUint16(i+10,true); let p=dv.getUint32(i+16,true); const out={};
  for(let k=0;k<n;k++){ if(dv.getUint32(p,true)!==0x02014b50) throw new Error('zip'); const method=dv.getUint16(p+10,true); const size=dv.getUint32(p+24,true); const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true); const lo=dv.getUint32(p+42,true); const name=dec.decode(buf.subarray(p+46,p+46+nl));
    if(method!==0) throw new Error('compressed'); const lnl=dv.getUint16(lo+26,true), lel=dv.getUint16(lo+28,true); const start=lo+30+lnl+lel; out[name]=buf.subarray(start,start+size); p+=46+nl+el+cl; }
  return out;
}
const b64=u=>{ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };

/* ========= 書き出し（ZIP）・上司へ送る・読み込み ========= */
const safeName=s=>String(s||'').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40)||'noname';
const dataUrlToBlob=d=>{ const [h,b]=d.split(','); const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:h.match(/data:(.*?);/)[1]}); };
function pad2(n){ return String(n).padStart(2,'0'); }
/* 見積もりアプリ向けの、項目名がそのまま分かるJSON */
function buildExport(s){
  const c=s.customer; const photos=[]; let pn=0;
  const works=blocks(s).map(b=>{
    const sel={}; (b.intro||[]).forEach((g,gi)=>{ sel[g.title]=s.answers[key(b.key,'intro',gi)]||''; });
    const shots=b.shots.map(([lab],i)=>{ const p=s.shots[key(b.key,'shots',i)]; if(!p) return {項目:lab,ファイル:''}; pn++; const f=`写真/${pad2(pn)}_${safeName(b.name)}_${safeName(lab)}.jpg`; photos.push({f,data:p.data}); return {項目:lab,ファイル:f}; });
    const cr=calcRows(b,s)||[];
    return { 種類コード:b.key, 種類:b.name, 選択:sel,
      見る:b.see.map(([lab],i)=>{ const v=s.see[key(b.key,'see',i)]||{}; return {項目:lab,確認済:!!v.done,メモ:v.memo||''}; }),
      採寸:b.measure.map(([lab,unit],i)=>({項目:lab,値:s.dims[key(b.key,'measure',i)]??'',単位:unit||''})),
      計算:[...cr.map(([n,a,k])=>({項目:n,実平米:+a.toFixed(2),倍率:k,提示平米:+(a*k).toFixed(2)})), ...(calcSimpleRows(b,s)||[]).map(([n,v])=>({項目:n,値:v}))],
      写真:shots,
      聞く:b.ask.map(([q],i)=>({質問:q,回答:s.answers[key(b.key,'ask',i)]||''})) };
  });
  const extra=s.extra.map(p=>{ pn++; const f=`写真/${pad2(pn)}_その他_${safeName(p.caption)||pn}.jpg`; photos.push({f,data:p.data}); return {ファイル:f,説明:p.caption||''}; });
  const json={ 形式:'ykart-genchi-v1', 書き出し日時:new Date().toISOString(), 調査日:c.date, 担当者:c.staff,
    お客様:{名前:c.name,住所:c.address,電話:c.tel,築年数:c.built,メモ:c.note},
    工事:works, その他の写真:extra, メモ:s.memo||'', 未入力:missing(s), 報告文:report(s) };
  // アプリに戻すための元データ（写真は上のファイル名で参照）
  const app=JSON.parse(JSON.stringify(s)); Object.keys(app.shots).forEach(k=>{ const b=blocks(s).find(x=>k.startsWith(x.key+'.')); const i=+k.split('.')[2]; const w=works.find(x=>x.種類コード===b.key); app.shots[k]={file:w.写真[i].ファイル,at:s.shots[k].at}; }); app.extra=app.extra.map((p,i)=>({id:p.id,caption:p.caption,file:extra[i].ファイル}));
  json._app=app;
  return {json,photos};
}
function exportName(s,ext){ return `現調_${s.customer.date}_${safeName(s.customer.name)}_${safeName(typeNames(s).join('・'))}.${ext}`; }
async function buildZip(s){
  const {json,photos}=buildExport(s);
  const entries=[{name:'現調データ.json',data:JSON.stringify(json,null,1)},{name:'報告書.txt',data:json.報告文}];
  photos.forEach(p=>entries.push({name:p.f,data:dataUrlToBlob(p.data)}));
  return makeZip(entries);
}
/* ファイルを保存：公開プレビューでは claude の保存機能、通常のブラウザではダウンロード */
async function saveFile(filename, blob){
  try{ const dl=window.claude?.use ? await window.claude.use('downloads') : null; if(dl){ await dl.save({filename,data:blob}); return 'saved'; } }catch(e){ if(e&&e.code==='declined') return 'declined'; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800); return 'saved';
}
async function exportZip(s){
  toast('まとめています…'); try{ const blob=await buildZip(s); const r=await saveFile(exportName(s,'zip'),blob); toast(r==='saved'?'書き出しました':'キャンセルしました'); }catch(e){ toast('書き出せませんでした'); }
}
/* 上司に送る：スマホの共有（LINE・メールなど）→ だめならメール作成 → だめならコピー */
async function sendToBoss(s){
  const text=report(s); const title=`【現調】${typeNames(s).join('・')} ${s.customer.name||''}様 ${s.customer.date}`;
  let boss=''; try{ boss=localStorage.getItem('bossMail')||''; }catch(e){}
  try{ if(navigator.share){ const blob=await buildZip(s); const file=new File([blob],exportName(s,'zip'),{type:'application/zip'}); const data=(navigator.canShare&&navigator.canShare({files:[file]}))?{title,text,files:[file]}:{title,text}; await navigator.share(data); toast('送りました'); return; } }catch(e){ if(e&&e.name==='AbortError'){ toast('キャンセルしました'); return; } }
  try{ await navigator.clipboard.writeText(text); }catch(e){}
  if(boss){ location.href=`mailto:${encodeURIComponent(boss)}?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(text.slice(0,1800))}`; toast('メールを作成しました。報告文はコピー済みです'); }
  else toast('報告文をコピーしました。LINEやメールに貼ってください。送り先はホーム画面で設定できます');
}
/* 読み込み：ZIP（写真つき）か JSON */
async function importFile(f){
  let s=null, zip=null; const dec=new TextDecoder();
  if(/\.zip$/i.test(f.name)){ zip=await readZip(f); const j=zip['現調データ.json']; if(!j) throw new Error('no json'); s=JSON.parse(dec.decode(j))._app; }
  else { const d=JSON.parse(await f.text()); s=d._app||d; }
  if(!s||!s.id||s.v!==3) throw new Error('format');
  if(zip){ for(const k of Object.keys(s.shots)){ const u=s.shots[k].file&&zip[s.shots[k].file]; if(u) s.shots[k]={data:'data:image/jpeg;base64,'+b64(u),at:s.shots[k].at}; else delete s.shots[k]; }
    s.extra=s.extra.map(p=>{ const u=p.file&&zip[p.file]; return u?{id:p.id,caption:p.caption,data:'data:image/jpeg;base64,'+b64(u)}:null; }).filter(Boolean); }
  else { Object.keys(s.shots).forEach(k=>{ if(!s.shots[k].data) delete s.shots[k]; }); s.extra=s.extra.filter(p=>p.data); }
  return s;
}

function report(s){
  const L=[]; const c=s.customer;
  L.push(`【現地調査報告】${typeNames(s).join('・')||'（種類未選択）'}　${c.name||'（お名前未入力）'} 様`);
  L.push(`調査日：${c.date}　担当：${c.staff||'－'}`, `住所：${c.address||'－'}　TEL：${c.tel||'－'}${c.built?`　築${c.built}年`:''}`);
  if(c.note) L.push(`その他：${c.note}`);
  blocks(s).forEach(b=>{
    L.push('',`■${b.name}`);
    (b.intro||[]).forEach((g,gi)=>L.push(`${g.title}：${s.answers[key(b.key,'intro',gi)]||'未選択'}`));
    const seen=b.see.map(([lab],i)=>{ const v=s.see[key(b.key,'see',i)]||{}; return {lab,v}; });
    const notes=seen.filter(x=>x.v.memo).map(x=>`・${x.lab}：${x.v.memo}`); const unseen=seen.filter(x=>!x.v.done).map(x=>x.lab);
    L.push(`[見た] ${seen.length-unseen.length}/${seen.length}`,...notes); if(unseen.length) L.push(`　未確認：${unseen.join('、')}`);
    if(b.measure.length){ L.push(`[採寸]`); b.measure.forEach(([lab,unit],i)=>{ const v=s.dims[key(b.key,'measure',i)]; L.push(`・${lab}：${String(v??'').trim()?v+(unit?' '+unit:''):'未'}`); }); }
    const cr=calcRows(b,s); if(cr) cr.forEach(([n,a,k])=>L.push(`・${n}：実平米 ${a.toFixed(1)}㎡ → 提示 ${(a*k).toFixed(1)}㎡（×${k}）`));
    const cs=calcSimpleRows(b,s); if(cs) cs.forEach(([n,v])=>L.push(`・${n}：${v}`));
    const taken=b.shots.filter((_,i)=>s.shots[key(b.key,'shots',i)]).length; const notTaken=b.shots.filter((_,i)=>!s.shots[key(b.key,'shots',i)]).map(x=>x[0]);
    if(b.shots.length) L.push(`[写真] ${taken}/${b.shots.length}${notTaken.length?'　未撮影：'+notTaken.join('、'):''}`);
    if(b.ask.length) L.push(`[聞いた]`); b.ask.forEach(([q],i)=>{ const a=s.answers[key(b.key,'ask',i)]; L.push(`・${q} → ${String(a??'').trim()?a:'未'}`); });
  });
  if(s.extra.length){ L.push('',`■その他の写真：${s.extra.length}枚`); s.extra.forEach((p,i)=>{ if(p.caption) L.push(`${i+1}. ${p.caption}`); }); }
  if(s.memo) L.push('',`■メモ・申し送り`,s.memo);
  const m=missing(s); if(m.length) L.push('',`■残り`,...m.map(x=>'・'+x));
  return L.join('\n');
}
function renderSummary(){
  const s=state.cur; const m=missing(s); const p=progress(s);
  view.innerHTML=`
  <div class="card"><h2>完了度 <span class="cnt">${p}%</span></h2><div class="prog"><i style="width:${p}%"></i></div>
    ${m.length?`<p class="muted" style="margin:10px 0 4px">帰る前に確認（お客様の前で埋めるのが一番早い）：</p><ul class="miss">${m.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p style="margin:10px 0 0;color:var(--ok);font-weight:700">全部そろっています。お疲れさまでした。</p>`}</div>
  <div class="tip"><b>帰る前のひとこと</b>「本日はありがとうございました。社内で確認して、〇日までにご連絡します」。分からなかった事は正直に「確認して連絡します」。</div>
  <div class="card"><h2>報告文</h2><pre class="report" id="reportText">${esc(report(s))}</pre>
    <div class="actions" style="margin-top:10px"><button class="btn primary" id="sendBtn" style="flex:1 1 100%">📨 上司に報告する</button><button class="btn" id="exportBtn" style="flex:1">資料をまとめて書き出す（ZIP）</button><button class="btn" id="copyBtn">報告文をコピー</button></div>
    <p class="muted" style="margin:8px 0 0">「上司に報告する」はスマホなら LINE やメールの選択画面が開き、報告文と資料ZIPが送れます。ZIPには見積もりアプリ用のデータ（JSON）・報告書・写真が入っています。</p></div>
  <div class="card">${state.confirmDel===s.id?`<div class="confirm"><span>この調査データを削除します。元に戻せません。</span><button class="btn sm danger" id="delYes">削除する</button><button class="btn sm" id="delNo">やめる</button></div>`:`<button class="btn danger sm" id="delBtn">この調査を削除</button>`}</div>
  <div class="actions"><button class="btn" data-go="customer">← お客様情報</button></div>`;
  $('#copyBtn').onclick=async()=>{ const t=report(s); try{ await navigator.clipboard.writeText(t); toast('コピーしました'); }catch(e){ const r=document.createRange(); r.selectNodeContents($('#reportText')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('文章を選択しました。長押しでコピーしてください'); } };
  $('#exportBtn').onclick=()=>exportZip(s);
  $('#sendBtn').onclick=()=>sendToBoss(s);
  const db=$('#delBtn'); if(db) db.onclick=()=>{ state.confirmDel=s.id; renderSummary(); };
  const dy=$('#delYes'); if(dy) dy.onclick=async()=>{ await DB.del(s.id); state.surveys=state.surveys.filter(x=>x.id!==s.id); state.cur=null; state.confirmDel=null; toast('削除しました'); render(); };
  const dn=$('#delNo'); if(dn) dn.onclick=()=>{ state.confirmDel=null; renderSummary(); };
  bindNav();
}
function bindNav(){ view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.go; render(); }); }
tabs.onclick=e=>{ const b=e.target.closest('[data-tab]'); if(b){ state.tab=b.dataset.tab; render(); } };
backBtn.onclick=async()=>{ if(state.cur){ await save(true); } state.cur=null; state.confirmDel=null; state.pick=null; render(); };

/* ========= 起動 ========= */
(async()=>{
  try{ state.kit=JSON.parse(localStorage.getItem('kit')||'{}'); }catch(e){}
  state.surveys=(await DB.all()).filter(s=>s.v===3);   // 旧形式のデータは表示しない
  render();
  if(!DB.ok) toast('この環境では保存できません。入力内容は画面を閉じると消えます');
  if('serviceWorker' in navigator && location.protocol==='https:'){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
})();
</script>
