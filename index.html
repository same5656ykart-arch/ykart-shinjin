<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<title>現地調査ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 1画面アプリ: 上に固定ヘッダー、下に固定タブ、中央がスクロール。紺の作業着 × 墨 × 朱のアクセント */
:root{
  --bg:#f3f3f0; --surface:#ffffff; --surface2:#e9eae6; --line:#d2d4ce;
  --fg:#1d2026; --muted:#5e636c;
  --accent:#1f3a5f; --accent-fg:#ffffff;
  --ok:#2e7d4f; --warn:#b8860b; --bad:#c8452b; --bad-bg:#fbe9e5; --ok-bg:#e4f2ea; --warn-bg:#fbf2d9;
  --tip:#eef3fa; --tip-line:#b9cbe4;
  --font-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-display:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171b; --surface:#1f2228; --surface2:#2a2e36; --line:#3a3f49;
  --fg:#eceef1; --muted:#a3a8b3;
  --accent:#8fb4e3; --accent-fg:#0f1a2a;
  --ok:#6cc08f; --warn:#e2b64a; --bad:#f08a74; --bad-bg:#3a2520; --ok-bg:#1e3328; --warn-bg:#3a3120;
  --tip:#222a36; --tip-line:#3a4b63; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15171b; --surface:#1f2228; --surface2:#2a2e36; --line:#3a3f49;
  --fg:#eceef1; --muted:#a3a8b3;
  --accent:#8fb4e3; --accent-fg:#0f1a2a;
  --ok:#6cc08f; --warn:#e2b64a; --bad:#f08a74; --bad-bg:#3a2520; --ok-bg:#1e3328; --warn-bg:#3a3120;
  --tip:#222a36; --tip-line:#3a4b63; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:72px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* 骨組み */
#app{display:flex;flex-direction:column;height:100%}
header.bar{background:var(--accent);color:var(--accent-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;min-height:52px}
header.bar h1{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.bar .sub{font-size:12px;opacity:.85;font-weight:400}
header.bar button{background:transparent;border:1px solid rgba(255,255,255,.45);color:inherit;border-radius:6px;padding:6px 10px;font-size:13px;white-space:nowrap}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main > .view{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 2px 7px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid transparent}
nav.tabs button .ic{font-size:18px;line-height:1;font-family:var(--font-display);font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent);font-weight:700}
nav.tabs button .dot{position:absolute}

/* 部品 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .cnt{font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row > *{flex:1 1 140px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.field label .req{color:var(--bad);font-weight:700;margin-left:3px}
.tip{background:var(--tip);border:1px solid var(--tip-line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.tip summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:6px}
.tip summary::before{content:"▸";transition:transform .15s}
.tip[open] summary::before{transform:rotate(90deg)}
.tip ul{margin:8px 0 0;padding-left:18px}
.tip li{margin:3px 0}
.tip .say{display:block;margin-top:8px;padding:8px 10px;background:var(--surface);border-radius:6px;border-left:3px solid var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;font-weight:400}
.btn.block{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:12px;color:var(--muted)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* チェックリスト */
.area{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.area > summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:15px}
.area > summary::after{content:"▸";margin-left:auto;color:var(--muted);transition:transform .15s}
.area[open] > summary::after{transform:rotate(90deg)}
.area .body{border-top:1px solid var(--line);padding:10px 14px 14px;display:flex;flex-direction:column;gap:12px}
.check{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check .name{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.check .look{font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:7px 2px;font-size:13px;border-radius:6px}
.seg button[aria-pressed="true"]{font-weight:700;border-width:2px}
.seg button[data-v="ok"][aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[data-v="fix"][aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg button[data-v="bad"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.seg button[data-v="na"][aria-pressed="true"]{background:var(--surface2);border-color:var(--muted)}
.check .memo-row{display:flex;gap:6px;align-items:stretch}
.check .memo-row input{flex:1}
.check .memo-row .btn{flex:0 0 auto}

/* 採寸 */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap}
td input{padding:7px 6px;font-size:14px}
td.num{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto}
.mrow{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.mrow .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.mrow .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mrow .calc{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mrow .calc b{color:var(--fg);font-variant-numeric:tabular-nums}

/* 写真 */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface2)}
.ph .meta{padding:6px;display:flex;flex-direction:column;gap:4px}
.ph .meta input,.ph .meta select{padding:5px 6px;font-size:13px}
.ph .meta .btn{align-self:flex-end}
.ph .no{position:absolute}
.shoot{display:flex;gap:8px;flex-wrap:wrap}
.shoot label{flex:1 1 140px}
.shoot input[type=file]{display:none}

/* まとめ */
.miss li{margin:3px 0}
pre.report{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:8px;padding:12px;font-family:var(--font-body);font-size:13px;line-height:1.5;margin:0;max-height:50vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.confirm{border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.home-hero{display:flex;flex-direction:column;gap:6px}
.home-hero h2{font-size:22px}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kit label{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.kit input{width:auto;margin:0}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <button id="backBtn" hidden aria-label="一覧へ戻る">← 一覧</button>
    <h1 id="title">現地調査ナビ <span class="sub">株式会社ワイケイアート</span></h1>
    <span id="saveState" class="sub"></span>
  </header>
  <main><div class="view" id="view"></div></main>
  <nav class="tabs" id="tabs" hidden></nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* ========= 調査項目の定義（新人向けガイド付き） ========= */
const STATUS = [
  {v:'ok', label:'○ 良好'}, {v:'fix', label:'△ 要補修'}, {v:'bad', label:'× 要交換'}, {v:'na', label:'－ 未確認'}
];
const AREAS = [
  {id:'ext', name:'外部（外壁・屋根まわり）',
   guide:{do:['建物の周りを一周して、四方向から全景写真を撮る','外壁は手で触って白い粉が付くか確認（チョーキング＝塗替えサイン）','屋根は地上から見える範囲だけ。絶対に登らない','雨漏りの跡（軒天・外壁のシミ）は必ず写真'],
          say:'「外まわりを一周して写真を撮らせていただいてもよろしいですか？」'},
   items:[
     {id:'wall', name:'外壁', look:'ひび割れ・チョーキング・コーキング(目地)の割れや痩せ・塗膜の剥がれ・コケ'},
     {id:'roof', name:'屋根', look:'瓦のズレ・色あせ・棟板金の浮き・コケ（地上から見える範囲）'},
     {id:'gutter', name:'雨樋', look:'外れ・歪み・詰まり・継手からの漏れ'},
     {id:'eave', name:'軒天・破風', look:'シミ・剥がれ・穴（雨漏りや鳥害のサイン）'},
     {id:'found', name:'基礎', look:'ひび割れ（幅0.3mm以上は要注意）・換気口の詰まり・白華'},
     {id:'balc', name:'バルコニー', look:'床防水の膨れ・ひび・排水口の詰まり・手すりのぐらつき'},
   ]},
  {id:'water', name:'水まわり',
   guide:{do:['設備の「メーカー・年式」は本体のシールで確認して写真','キッチンは間口（幅）を測る。ユニットバスは浴槽横の規格サイズを探す','床のふかつき（踏むと沈む）は水漏れのサイン','排水の流れ・臭い・水圧も確認'],
          say:'「水まわりは普段お困りのことはありますか？排水の流れや臭いなど」'},
   items:[
     {id:'kitchen', name:'キッチン', look:'間口W・高さ・型（I型/L型）・換気扇の動作・水栓の漏れ・床のふかつき・年式'},
     {id:'bath', name:'浴室', look:'在来 or ユニット・サイズ(1216/1616など)・換気扇・カビ・床タイルの割れ・窓・追焚き有無'},
     {id:'wash', name:'洗面', look:'間口W・排水の流れ・鏡裏収納・コンセント・水漏れ跡'},
     {id:'toilet', name:'トイレ', look:'便器型（タンク有無）・床材・温水洗浄用コンセントの有無・手洗い・換気'},
     {id:'boiler', name:'給湯器', look:'種類（ガス/エコキュート/灯油）・号数・設置年・設置場所・リモコンの表示'},
   ]},
  {id:'int', name:'内装',
   guide:{do:['部屋ごとに床・壁・天井の順で見る','床は歩いてきしみ・傾き・沈みを確認','天井のシミは雨漏りか結露か。上階や屋根と位置を照合','建具は実際に開け閉めしてみる'],
          say:'「お部屋の中も見せていただいてよろしいですか？収納の中も少し拝見します」'},
   items:[
     {id:'floor', name:'床', look:'きしみ・傾き・沈み・床材の種類（フローリング/CF/畳）・傷'},
     {id:'wallin', name:'壁', look:'クロスの剥がれ・浮き・カビ・ひび・下地の種類'},
     {id:'ceil', name:'天井', look:'シミ・たわみ・クロスの剥がれ・天井高'},
     {id:'door', name:'建具', look:'開閉のスムーズさ・建付け・鍵・蝶番・敷居の摩耗'},
     {id:'storage', name:'収納', look:'カビ・湿気・棚の状態・広さ'},
   ]},
  {id:'win', name:'窓・サッシ',
   guide:{do:['窓のサイズは「枠の内側」を測る','結露の跡（サッシ下の黒カビ・木枠の腐れ）を見る','網戸・シャッター・雨戸の動作を確認'],
          say:'「冬の結露や、夏の暑さは気になりますか？」'},
   items:[
     {id:'sash', name:'サッシ', look:'種類（アルミ/樹脂/複合）・単板 or ペアガラス・開閉・クレセント錠'},
     {id:'conden', name:'結露・断熱', look:'結露跡・カビ・木枠の腐れ・隙間風'},
     {id:'screen', name:'網戸・シャッター・雨戸', look:'破れ・動作・戸袋の状態'},
   ]},
  {id:'elec', name:'電気・設備',
   guide:{do:['分電盤を開けて写真（契約アンペア・回路数・空き）','増設したい場所のコンセント位置を聞く','エアコンは年式と台数、インターホンの型も確認'],
          say:'「分電盤はどちらにありますか？写真を撮らせてください」'},
   items:[
     {id:'panel', name:'分電盤', look:'契約アンペア・回路数・空き回路・漏電ブレーカー・設置年'},
     {id:'outlet', name:'コンセント・照明', look:'不足している場所・スイッチの不具合・照明の種類'},
     {id:'ac', name:'エアコン', look:'台数・年式・配管の位置・室外機の設置場所'},
     {id:'phone', name:'インターホン・TV・LAN', look:'型・モニター有無・アンテナ・配線ルート'},
   ]},
  {id:'site', name:'外構・現場環境',
   guide:{do:['駐車できる場所と台数を確認（工事車両）','資材の搬入経路（道幅・階段・エレベーター）を写真','工事中の電気・水道を借りられるか','ご近所との関係や注意点を聞く'],
          say:'「工事の際、車はこちらに停めさせていただけますか？」'},
   items:[
     {id:'parking', name:'駐車スペース', look:'台数・前面道路の幅・路駐の可否'},
     {id:'route', name:'搬入経路', look:'道幅・階段・エレベーター・養生が必要な場所'},
     {id:'exterior', name:'門扉・フェンス・庭', look:'門扉の動作・フェンスの傾き・植栽・外部水栓'},
     {id:'neighbor', name:'近隣・騒音', look:'隣家との距離・足場が立つスペース・挨拶が必要なお宅'},
   ]},
];
const AREA_MAP = Object.fromEntries(AREAS.map(a=>[a.id,a]));
const ITEM_MAP = {}; AREAS.forEach(a=>a.items.forEach(i=>ITEM_MAP[i.id]={...i, area:a}));

const KIT = ['メジャー(5.5m)','レーザー距離計','スマホ(充電OK)','懐中電灯','脚立','水平器','マスキングテープ','筆記用具','名刺','図面・資料','スリッパ','養生シート','クラックスケール','マスク・手袋'];

const REQUIRED = [
  ['basic.customer','お客様名'],['basic.address','住所'],['basic.tel','電話番号'],['basic.date','調査日'],['basic.staff','担当者'],
  ['basic.request','ご要望（工事内容）'],['hearing.trouble','お困りごと'],['hearing.timing','希望時期'],['hearing.budget','ご予算感'],
];

/* ========= 保存（IndexedDB。使えない時はメモリ） ========= */
const DB = {
  mem:{}, ok:true,
  open(){ return new Promise((res,rej)=>{ try{
    const r=indexedDB.open('genchi-navi',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('surveys',{keyPath:'id'});
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }catch(e){rej(e)} }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('surveys',mode); const q=fn(t.objectStore('surveys')); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async all(){ try{ const r=await this.tx('readonly',s=>s.getAll()); this.ok=true; return r; }catch(e){ this.ok=false; return Object.values(this.mem); } },
  async put(s){ this.mem[s.id]=s; try{ await this.tx('readwrite',st=>st.put(s)); this.ok=true; }catch(e){ this.ok=false; throw e; } },
  async del(id){ delete this.mem[id]; try{ await this.tx('readwrite',st=>st.delete(id)); }catch(e){} },
};

/* ========= 状態 ========= */
const state = { surveys:[], cur:null, tab:'basic', confirmDel:null, kit:{} };
const $ = sel=>document.querySelector(sel);
const view = $('#view'), tabs=$('#tabs'), titleEl=$('#title'), backBtn=$('#backBtn'), saveState=$('#saveState');
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }

function newSurvey(){ return {
  id:uid(), createdAt:Date.now(), updatedAt:Date.now(),
  basic:{date:today(), staff:'', customer:'', address:'', tel:'', built:'', structure:'', floors:'', request:''},
  hearing:{trouble:'', wish:'', budget:'', timing:'', family:'', pets:'', note:''},
  checks:{}, photos:[], rooms:[], openings:[], summary:{note:''}
}; }
function get(obj,path){ return path.split('.').reduce((o,k)=>o?.[k],obj); }
function set(obj,path,val){ const ks=path.split('.'); const last=ks.pop(); const o=ks.reduce((o,k)=>o[k]??(o[k]={}),obj); o[last]=val; }

let saveTimer=null;
function save(immediate){
  if(!state.cur) return;
  state.cur.updatedAt=Date.now();
  saveState.textContent='保存中…';
  clearTimeout(saveTimer);
  const run=async()=>{ try{ await DB.put(state.cur); saveState.textContent='保存済'; }catch(e){ saveState.textContent='⚠ 端末に保存できません'; } };
  if(immediate) return run(); saveTimer=setTimeout(run,400);
}

/* ========= 進捗・不足チェック ========= */
function missing(s){
  const m=[];
  REQUIRED.forEach(([p,label])=>{ if(!String(get(s,p)??'').trim()) m.push(label); });
  AREAS.forEach(a=>{ const un=a.items.filter(i=>!s.checks[i.id]?.status); if(un.length===a.items.length) m.push(a.name+'：未確認'); else if(un.length) m.push(a.name+'：'+un.map(i=>i.name).join('・')+' が未確認'); });
  if(s.photos.length<4) m.push('写真が少ない（最低でも全景4方向）');
  if(!s.rooms.length && !s.openings.length) m.push('採寸なし');
  const ngNoPhoto = Object.entries(s.checks).filter(([id,c])=>(c.status==='fix'||c.status==='bad') && !s.photos.some(p=>p.item===id));
  ngNoPhoto.forEach(([id])=>m.push(ITEM_MAP[id].name+'：△×なのに写真がない'));
  return m;
}
function progress(s){
  const total=REQUIRED.length+Object.keys(ITEM_MAP).length; let done=0;
  REQUIRED.forEach(([p])=>{ if(String(get(s,p)??'').trim()) done++; });
  Object.keys(ITEM_MAP).forEach(id=>{ if(s.checks[id]?.status) done++; });
  return Math.round(done/total*100);
}

const TABS=[['basic','基本','基'],['hearing','聞く','聞'],['check','見る','見'],['measure','測る','測'],['photo','写真','写'],['summary','まとめ','締']];
function render(){
  if(!state.cur){ renderHome(); return; }
  backBtn.hidden=false; tabs.hidden=false;
  const c=state.cur.basic.customer;
  titleEl.innerHTML = esc(c? c+' 様' : '新規調査') + ' <span class="sub">'+esc(state.cur.basic.date)+'</span>';
  tabs.innerHTML = TABS.map(([id,l,ic])=>`<button data-tab="${id}" ${state.tab===id?'aria-current="page"':''}><span class="ic">${ic}</span>${l}</button>`).join('');
  ({basic:renderBasic, hearing:renderHearing, check:renderCheck, measure:renderMeasure, photo:renderPhoto, summary:renderSummary})[state.tab]();
  $('main').scrollTop=0;
}
function field(path,label,opts={}){
  const v=get(state.cur,path)??''; const id='f_'+path.replace(/\./g,'_');
  const req=opts.req?'<span class="req">必須</span>':'';
  let input;
  if(opts.type==='textarea') input=`<textarea id="${id}" data-path="${path}" placeholder="${esc(opts.ph||'')}">${esc(v)}</textarea>`;
  else if(opts.type==='select') input=`<select id="${id}" data-path="${path}"><option value="">選択</option>${opts.options.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else input=`<input id="${id}" type="${opts.type||'text'}" data-path="${path}" value="${esc(v)}" placeholder="${esc(opts.ph||'')}" ${opts.attrs||''}>`;
  return `<div class="field"><label for="${id}">${esc(label)}${req}</label>${input}</div>`;
}
function guide(title,g){
  return `<details class="tip"><summary>新人ガイド：${esc(title)}</summary><ul>${g.do.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${g.say?`<span class="say">声かけ例：${esc(g.say)}</span>`:''}</details>`;
}

/* 写真：端末内保存のため長辺1280pxに縮小 */
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const max=1280; const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); }; img.src=url; }); }
async function addPhotos(files,extra={}){
  const s=state.cur; let n=0;
  for(const f of files){ try{ const data=await shrink(f); s.photos.push({id:uid(), at:Date.now(), caption:'', ...extra, data}); n++; }catch(e){} }
  if(n){ try{ await save(true); toast(n+'枚を追加'); }catch(e){ toast('保存容量が足りません。写真を減らすか書き出してください'); } }
}

  <p class="muted" style="margin:8px 0 0">写真は端末内に縮小保存されます（元の写真はスマホのカメラロールにも残ります）。</p></div>
  <div class="card"><h2>撮影済み <span class="cnt">${s.photos.length}枚</span></h2>
    ${s.photos.length?`<div class="photos">${[...s.photos].reverse().map((p,idx)=>`<div class="ph" data-ph="${p.id}"><img src="${p.data}" alt="${esc(p.caption||'写真')}" loading="lazy"><div class="meta"><select data-pf="item">${itemOpts(p.item)}</select><input data-pf="caption" value="${esc(p.caption)}" placeholder="ひとこと（例：北面 外壁ひび）"><button class="btn sm danger" data-delph="${p.id}">削除</button></div></div>`).join('')}</div>`:'<div class="empty">まだ写真がありません</div>'}
  </div>
  <div class="actions"><button class="btn" data-go="measure">← 測る</button><button class="btn primary" style="flex:1" data-go="summary">次へ：まとめ →</button></div>`;
  $('#shootCam').onchange=e=>addPhotos(e.target.files).then(renderPhoto);
  $('#shootLib').onchange=e=>addPhotos(e.target.files).then(renderPhoto);
  view.querySelectorAll('[data-ph] [data-pf]').forEach(i=>i.oninput=i.onchange=()=>{ const p=s.photos.find(x=>x.id===i.closest('[data-ph]').dataset.ph); p[i.dataset.pf]=i.value; save(); });
  view.querySelectorAll('[data-delph]').forEach(b=>b.onclick=()=>{ s.photos=s.photos.filter(p=>p.id!==b.dataset.delph); save(); renderPhoto(); });
  bindNav();
}

function report(s){
  const st=v=>({ok:'○',fix:'△要補修',bad:'×要交換',na:'－未確認'}[v]||'（未チェック）');
  const L=[];
  L.push(`【現地調査報告】${s.basic.customer||'（未入力）'} 様`);
  L.push(`調査日：${s.basic.date}　担当：${s.basic.staff||'－'}`);
  L.push(`住所：${s.basic.address||'－'}　TEL：${s.basic.tel||'－'}`);
  L.push(`建物：築${s.basic.built||'?'}年 / ${s.basic.structure||'構造不明'} / ${s.basic.floors||'－'}`);
  L.push('',`■ご要望`,s.basic.request||'－');
  L.push('',`■お困りごと（きっかけ）`,s.hearing.trouble||'－');
  if(s.hearing.wish) L.push(`■理想`,s.hearing.wish);
  L.push('',`■条件`,`予算感：${s.hearing.budget||'－'}　希望時期：${s.hearing.timing||'－'}`,`家族・住まい方：${s.hearing.family||'－'}　ペット・鍵：${s.hearing.pets||'－'}`);
  if(s.hearing.note) L.push(`その他：${s.hearing.note}`);
  L.push('',`■現場チェック（要対応のみ）`);
  let ng=0;
  AREAS.forEach(a=>a.items.forEach(i=>{ const c=s.checks[i.id]; if(c&&['fix','bad'].includes(c.status)){ ng++; L.push(`・${a.name.split('（')[0]}/${i.name}：${st(c.status)}${c.memo?'　'+c.memo:''}`);} }));
  if(!ng) L.push('（要対応なし）');
  const un=Object.values(ITEM_MAP).filter(i=>!s.checks[i.id]?.status||s.checks[i.id].status==='na');
  if(un.length) L.push(`未確認：${un.map(i=>i.name).join('・')}`);
  if(s.rooms.length){ L.push('',`■採寸（mm）`); s.rooms.forEach(r=>{ const a=(r.w&&r.d)?(r.w*r.d/1e6).toFixed(2):'－'; L.push(`・${r.name||'部屋'}：W${r.w||'?'} × D${r.d||'?'} × H${r.h||'?'}（${a}㎡）${r.note?'　'+r.note:''}`); }); }
  if(s.openings.length){ L.push(`■開口部・設備サイズ（mm）`); s.openings.forEach(o=>L.push(`・${o.place||'－'}${o.type?'('+o.type+')':''}：W${o.w||'?'} × H${o.h||'?'}${o.fl?' FL+'+o.fl:''}${o.note?'　'+o.note:''}`)); }
  L.push('',`■写真：${s.photos.length}枚`);
  s.photos.forEach((p,i)=>{ const lab=p.item==='_all'?'全景':p.item==='_doc'?'書類':ITEM_MAP[p.item]?.name||''; if(lab||p.caption) L.push(`${i+1}. ${lab}${lab&&p.caption?' ':''}${p.caption||''}`); });
  if(s.summary.note) L.push('',`■所感・申し送り`,s.summary.note);
  const m=missing(s); if(m.length) L.push('',`■未入力・要確認`,...m.map(x=>'・'+x));
  return L.join('\n');
}
function renderSummary(){
  const s=state.cur; const m=missing(s); const p=progress(s);
  view.innerHTML=`
  <div class="card"><h2>完了度 <span class="cnt">${p}%</span></h2><div class="prog"><i style="width:${p}%"></i></div>
    ${m.length?`<p class="muted" style="margin:10px 0 4px">帰る前に確認（お客様の前で埋めるのが一番早い）：</p><ul class="miss">${m.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p style="margin:10px 0 0;color:var(--ok);font-weight:700">必須項目はそろっています。お疲れさまでした。</p>`}
  </div>
  ${guide('帰る前の締め',{do:['「本日の内容を社内で確認し、〇日までにご連絡します」と期日を言う','見られなかった所・分からなかった事は正直に「確認して連絡します」','報告文をコピーして、先輩・上司にその日のうちに送る','写真つきデータ（JSON）は書き出してPCに保存'],say:'「本日はありがとうございました。〇日までにお見積りの方向性をご連絡いたします」'})}
  <div class="card"><h2>所感・申し送り</h2>${field('summary.note','気づいたこと・先輩に相談したいこと',{type:'textarea',ph:'例：浴室の窓が大きく、ユニットバス1616は入るか要確認。お客様は補助金に関心あり'})}</div>
  <div class="card"><h2>報告文</h2><pre class="report" id="reportText">${esc(report(s))}</pre>
    <div class="actions" style="margin-top:10px"><button class="btn primary" id="copyBtn">報告文をコピー</button><button class="btn" id="exportBtn">写真つきデータを書き出す（JSON）</button></div>
    <p class="muted" style="margin:8px 0 0">コピーした文章はLINEやメールにそのまま貼れます。</p></div>
  <div class="card">${state.confirmDel===s.id?`<div class="confirm"><span>この調査データを削除します。元に戻せません。</span><button class="btn sm danger" id="delYes">削除する</button><button class="btn sm" id="delNo">やめる</button></div>`:`<button class="btn danger sm" id="delBtn">この調査を削除</button>`}</div>
  <div class="actions"><button class="btn" data-go="photo">← 写真</button></div>`;
  bindFields(()=>{ $('#reportText').textContent=report(s); });
  $('#copyBtn').onclick=async()=>{ const t=report(s); try{ await navigator.clipboard.writeText(t); toast('コピーしました'); }catch(e){ const r=document.createRange(); r.selectNodeContents($('#reportText')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('文章を選択しました。長押しでコピーしてください'); } };
  $('#exportBtn').onclick=()=>{ const blob=new Blob([JSON.stringify(s,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`genchi_${s.basic.date}_${(s.basic.customer||'noname').replace(/\s+/g,'')}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); toast('書き出しました'); };
  const db=$('#delBtn'); if(db) db.onclick=()=>{ state.confirmDel=s.id; renderSummary(); };
  const dy=$('#delYes'); if(dy) dy.onclick=async()=>{ await DB.del(s.id); state.surveys=state.surveys.filter(x=>x.id!==s.id); state.cur=null; state.confirmDel=null; toast('削除しました'); render(); };
  const dn=$('#delNo'); if(dn) dn.onclick=()=>{ state.confirmDel=null; renderSummary(); };
}

function bindFields(after){
  view.querySelectorAll('[data-path]').forEach(el=>{ el.oninput=el.onchange=()=>{ set(state.cur,el.dataset.path,el.value); save(); if(el.dataset.path==='basic.customer'||el.dataset.path==='basic.date'){ const c=state.cur.basic.customer; titleEl.innerHTML=esc(c?c+' 様':'新規調査')+' <span class="sub">'+esc(state.cur.basic.date)+'</span>'; } if(after) after(); }; });
  bindNav();
}
function bindNav(){ view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.go; render(); }); }
tabs.onclick=e=>{ const b=e.target.closest('[data-tab]'); if(b){ state.tab=b.dataset.tab; render(); } };
backBtn.onclick=async()=>{ if(state.cur){ await save(true); } state.cur=null; state.confirmDel=null; render(); };

/* ========= 起動 ========= */
(async()=>{
  try{ state.kit=JSON.parse(localStorage.getItem('kit')||'{}'); }catch(e){}
  state.surveys=await DB.all();
  render();
  if(!DB.ok) toast('この環境では保存できません。入力内容は画面を閉じると消えます');
  if('serviceWorker' in navigator && location.protocol==='https:'){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
})();
</script>
